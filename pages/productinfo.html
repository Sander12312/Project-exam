<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/productinfo.css">
  <!--Icons-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Barbershop | Product</title>
</head>

<body>
 <header class="header">
    <nav class="navbar section-content">
      <a href="/index.html#home" class="logo-text">Barbershop</a>

      <ul class="nav-menu">
       <button id="menu-close-button" type="button">×</button>
        <li><a href="/index.html#home" class="nav-link">Home</a></li>
        <li><a href="/index.html#products" class="nav-link">Products</a></li>
        <li><a href="/index.html#about" class="nav-link">About</a></li>
        <li><a href="/index.html#contact" class="nav-link">Contact</a></li>
      </ul>
     <button id="menu-open-button" type="button">☰</button>
    </nav>
  </header>

  <main class="product-info-page">
    <div class="section-content">

      <div class="product-info-top">
        <div class="product-image-wrapper">
          <img
            src=""
            alt=""
            class="product-image"
            id="product-image"
          >
        </div>

        <div class="product-info-details">
          <h1 class="product-title" id="product-title">Product</h1>

          <div class="product-rating">
            <span class="stars" id="product-stars">★★★★☆</span>
            <span class="rating-number" id="product-rating">4.2 / 5</span>
            <button type="button" id="share-button" class="share-button" aria-label="Share product"> <i class="fa-solid fa-share-nodes"></i> Share</button>
          </div>

          <p class="product-description" id="product-description">
            Product description
          </p>

          <ul class="product-features" id="product-tags">
            <li>Tag</li>
          </ul>

          <div class="product-price" id="product-price">499</div>

          <div class="product-buttons">
            <button class="button order-now" id="add-to-cart-button" type="button">Add to cart</button>
            <a href="/pages/cart.html" class="button go-cart">Go to cart</a>
          </div>
        </div>
      </div>

      <div class="product-reviews">
        <h2 class="reviews-title">Reviews</h2>

        <div id="reviews-list">
          <div class="review">
            <div class="review-icon">
              <i class="fa-solid fa-user"></i>
            </div>
            <div class="review-content">
              <h3>Customer</h3>
              <p>Review will appear here</p>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="footer-content">
      <p class="footer-brand">Barbershop ®</p>

      <div class="footer-socials">
        <a href="#" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" aria-label="Twitter">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>

      <p class="footer-terms">Terms and conditions</p>
    </div>
  </footer>

  <script src="/js/productinfo.js"></script>
  <script src="/js/navigation.js"></script>
</body>
</html>
