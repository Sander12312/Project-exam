<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="/styles/global.css">
  <link rel="stylesheet" href="/styles/login.css">
  <!--Icons-->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <title>Barbershop | Login</title>
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <nav class="navbar section-content">
      <a href="/index.html#home" class="logo-text">Barbershop</a>

      <ul class="nav-menu">
       <button id="menu-close-button" type="button">×</button>
        <li><a href="/index.html#home" class="nav-link">Home</a></li>
        <li><a href="/index.html#products" class="nav-link">Products</a></li>
        <li><a href="/index.html#about" class="nav-link">About</a></li>
        <li><a href="/index.html#contact" class="nav-link">Contact</a></li>
      </ul>
     <button id="menu-open-button" type="button">☰</button>
    </nav>
  </header>

  <!-- Login -->
  <main class="login-page">
    <div class="login-wrapper">
      <form class="login-card" id="login-form">
        <h1 class="login-title">Login</h1>
        <div class="login-group">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" autocomplete="email" required>
        </div>
        <div class="login-group">
          <label for="login-password">Password</label>
          <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <p id="login-message" class="form-message"></p>
        <p class="login-register">
          Don’t have an account?
          <a href="/pages/register.html">Register here</a>
        </p>
        <button type="submit" class="login-button">Login</button>
      </form>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <div class="footer-content">
      <p class="footer-brand">Barbershop ®</p>

      <div class="footer-socials">
        <a href="#" aria-label="Facebook">
          <i class="fa-brands fa-facebook-f"></i>
        </a>
        <a href="#" aria-label="Instagram">
          <i class="fa-brands fa-instagram"></i>
        </a>
        <a href="#" aria-label="Twitter">
          <i class="fa-brands fa-x-twitter"></i>
        </a>
      </div>

      <p class="footer-terms">Terms and conditions</p>
    </div>
  </footer>
  <script src="/js/login.js"></script>
  <script src="/js/navigation.js"></script>
</body>
</html>
